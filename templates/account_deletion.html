<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Delete GChats Account</title>
  <style>body{font-family:system-ui;max-width:520px;margin:40px auto;padding:0 20px;color:#18202a}label{display:block;margin-top:16px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccd3dd;border-radius:10px}button{margin-top:20px;padding:12px 18px;border:0;border-radius:10px;background:#b42318;color:white;font-weight:700}.ok{background:#e8f7ed;padding:12px;border-radius:10px}.error{background:#ffebe9;padding:12px;border-radius:10px}</style>
</head>
<body>
  <h1>Delete GChats account</h1>
  <p>This permanently deletes your account and associated database records. This cannot be undone.</p>
  {% if message %}<p class="ok">{{ message }}</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if not message %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username<input name="username" required autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit">Permanently delete account</button>
  </form>
  {% endif %}
</body>
</html>
