services:
  - type: web
    name: kulot-friends-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 100 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: INVITE_CODE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: REMEMBER_DAYS
        value: "90"
      - key: HISTORY_PAGE_SIZE
        value: "50"
      - key: ANDROID_PACKAGE_NAME
        value: "com.kulot.friends"
      - key: ANDROID_SHA256_FINGERPRINT
        sync: false
