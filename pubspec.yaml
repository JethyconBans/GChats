name: gchats_native
description: Fast native Android client for GChats.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  socket_io_client: ^3.0.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gchats_icon.png
